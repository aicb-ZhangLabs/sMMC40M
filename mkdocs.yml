site_name: sMCC40M
site_description: >-
  A context-aware dataset and benchmark for single-cell spatial transcriptomics:
  38.5M gene-positive cell and nucleus observations with expression, geometry,
  sample context and documented image eligibility.
site_url: https://aicb-zhanglabs.github.io/sMMC40M/
repo_url: https://github.com/aicb-ZhangLabs/sMMC40M
repo_name: aicb-ZhangLabs/sMMC40M
edit_uri: edit/main/website/
copyright: >-
  Code: see repository license · Data: CC BY 4.0 with per-sample attribution ·
  Zhang Lab, UC Irvine

docs_dir: website
exclude_docs: |
  hooks/
site_dir: _site

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: DM Sans
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

hooks:
  - website/hooks/latest_updates.py
  - website/hooks/notebook_links.py

plugins:
  - search
  - blog:
      blog_dir: updates
      blog_toc: true
      post_date_format: long
      post_url_format: "{slug}"
      post_excerpt: required
      archive_name: By month
      archive_date_format: MMMM yyyy
      categories_name: Topics
      pagination_per_page: 10
  - mkdocs-jupyter:
      execute: false
      include_source: true
      ignore_h1_titles: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - def_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/aicb-ZhangLabs/sMMC40M
    - icon: simple/huggingface
      link: https://huggingface.co/datasets/zhang-lab/sMCC40M

nav:
  - Home: index.md
  - Dataset:
      - dataset/index.md
      - Download: dataset/download.md
      - Files and joins: dataset/structure.md
      - Sample context: dataset/context.md
  - Tutorials:
      - tutorials/index.md
      - 1 · Download and read a sample: tutorials/01_download_and_read.ipynb
      - 2 · Explore one acquisition: tutorials/02_explore_acquisition.ipynb
      - 3 · Pair cells with H&E: tutorials/03_histology_crops.ipynb
      - 4 · Choose samples by context: tutorials/04_context_selection.ipynb
      - 5 · Run the benchmark: tutorials/05_benchmark.ipynb
  - Benchmark: benchmark.md
  - What's new:
      - updates/index.md
  - Cite: citation.md
